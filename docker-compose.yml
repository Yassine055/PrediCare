version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: predicare_postgres
    environment:
      POSTGRES_DB: predicare_db
      POSTGRES_USER: predicare_user
      POSTGRES_PASSWORD: predicare123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicare_user -d predicare_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predicare_backend
    environment:
      DATABASE_URL: postgresql://predicare_user:predicare123@postgres:5432/predicare_db
      SECRET_KEY: ${SECRET_KEY:-predicare_docker_secret_key_2025}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml
      - ./reports:/app/reports
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predicare_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
